serverConfig:
  node.environment: test
  http-server.http.port: ${ENV:REQUEST_ROUTER_PORT}

dataStore:
  jdbcUrl: ${ENV:POSTGRESQL_JDBC_URL}
  user: ${ENV:POSTGRESQL_USER}
  password: ${ENV:POSTGRESQL_PASSWORD}
  driver: org.postgresql.Driver

authorization:
  admin: .*FOO.*
  user: .*BAR.*
  api: .*BAZ.*

presetUsers:
  admin1:
    password: admin1_password
    privileges: FOO_BAR
  user1:
    password: password_user1
    privileges: BAR_BAZ

# The scalar defaultType names only "oauth" (bound as a one-element list), but no oauth block is
# configured while a form block is. The listed method is unusable, so the login page falls back
# to the configured form method and the gateway still boots — the backward-compatibility
# guarantee that a configured method is always accepted.
authentication:
  defaultType: "oauth"
  form:
    selfSignKeyPair:
      privateKey: src/test/resources/auth/test_private_key.pem
      publicKey: src/test/resources/auth/test_public_key.pem
