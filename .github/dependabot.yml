version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Apply 7 day cooldown to avoid updating dependencies right away. This reduces the opportunity window
      # when supply chain is compromised.
      default-days: 7
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      airlift:
        patterns:
          - "io.airlift:airbase"
          - "io.airlift:bom"
    cooldown:
      # Apply 7 day cooldown to avoid updating dependencies right away. This reduces the opportunity window
      # when supply chain is compromised. This doesn't apply to the dependencies that we own and release.
      default-days: 7
      exclude:
        - io.airlift:*
        - io.trino:*
  - package-ecosystem: "npm"
    directory: "webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Dependencies are pinned to exact versions. Rewrite the version in
    # package.json on every update rather than only touching the lockfile.
    versioning-strategy: increase
    # Updates are deliberately not grouped. A grouped pull request fails as a
    # whole when a single update breaks, and cannot be merged in parts.
    ignore:
      # Never run ahead of the Trino web UI on a major version of the packages
      # shared with it. Majors land when the web UI adopts them, while minor
      # and patch updates flow freely. The web UI manifest is the reference:
      # https://github.com/trinodb/trino/blob/master/core/trino-web-ui/src/main/resources/webapp/package.json
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
    cooldown:
      # Apply 7 day cooldown to avoid updating dependencies right away. This reduces the opportunity window
      # when supply chain is compromised.
      default-days: 7
