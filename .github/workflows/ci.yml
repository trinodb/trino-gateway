name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

env:
  # Use Maven wrapper from repo with Maven version and other configs
  MAVEN: ./mvnw -B
  MAVEN_FAST_INSTALL: "-B -V -T 1C -DskipTests -Dmaven.source.skip=true -Dair.check.skip-all"

jobs:
  check-commit-messages:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: airlift/github-actions/check-commit-messages@1652e24519f5c7cec59d841070bf9beffadabdf9 # v1
        with:
          base_ref: ${{ github.event.pull_request.base.ref }}

  maven-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: 
          - { java-version: 25 }
          - { java-version: 26 }
          - { java-version: 27-ea }
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      - name: Install required Java distribution
        uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
          distribution: 'temurin'
      - name: Build with Maven
        run: $MAVEN clean verify

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      - name: Install required Java distribution
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Maven Build
        run: $MAVEN install ${MAVEN_FAST_INSTALL}
      - uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: amd64,arm64
      - name: Build and Test Docker Image
        run: docker/build.sh
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.12.1
